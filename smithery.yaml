# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

name: scala-mcp-server
displayName: "S.C.A.L.A. AI OS — Business Operating System"
description: >-
  Run your entire business from Claude. S.C.A.L.A. is an enterprise AI
  operating system with CRM, invoicing, bookings, SARA AI assistant (WhatsApp,
  email, voice), workflow automation, and 20 industry-specific vertical modules
  (restaurants, real estate, agencies, car dealerships, and more). Includes
  company intelligence database (financials only FR NO LT EE LV CO) for search, enrichment, and due diligence.
version: 1.1.0
author: "Alessandro Binda <ale@get-scala.com>"
license: MIT
repository: https://github.com/Alessandro114/scala-mcp-server

icon: https://get-scala.com/scala-logo.svg
category: Business & Productivity

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - scalaApiKey
    properties:
      scalaApiKey:
        type: string
        description: "Your S.C.A.L.A. API key. Get one free at https://app.get-scala.com"
      scoreApiKey:
        type: string
        description: "Score API key for company data (free: https://score.get-scala.com/builders)"
      scoreApiUrl:
        type: string
        description: "Score API base URL (optional, default https://score.get-scala.com/api/v1)"
      scalaApiUrl:
        type: string
        description: "API base URL (optional)"
  exampleConfig:
    scalaApiKey: "sk-your-api-key"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'scala-mcp-server'],
      env: {
        SCALA_API_KEY: config.scalaApiKey,
        ...(config.scoreApiKey ? { SCORE_API_KEY: config.scoreApiKey } : {}),
        ...(config.scoreApiUrl ? { SCORE_API_URL: config.scoreApiUrl } : {}),
        ...(config.scalaApiUrl ? { SCALA_API_URL: config.scalaApiUrl } : {})
      }
    })

build:
  dockerfile: Dockerfile

capabilities:
  # Score (Company Intelligence)
  - search_companies:
      description: "Search companies by name or tax/VAT id (identification data worldwide; financials only FR NO LT EE LV CO, 1 credit)"
      alwaysAllow: true
  - lookup_company:
      description: "Full company profile by id from search (1 credit); revenue_type reported|estimated; keep data_licences attribution"
      alwaysAllow: true
  - list_countries:
      description: "List countries available in the Score database"
      alwaysAllow: true
  - check_credits:
      description: "Check API credits and plan"
      alwaysAllow: true
  # CRM
  - crm_list_contacts:
      description: "List and search CRM contacts"
      alwaysAllow: true
  - crm_create_contact:
      description: "Create a new CRM contact"
      alwaysAllow: false
  - crm_update_contact:
      description: "Update an existing CRM contact"
      alwaysAllow: false
  - crm_pipeline:
      description: "View sales pipeline"
      alwaysAllow: true
  - crm_contact_timeline:
      description: "Get contact activity timeline"
      alwaysAllow: true
  # Bookings
  - booking_get_slots:
      description: "Get available booking slots"
      alwaysAllow: true
  - booking_create:
      description: "Create a booking"
      alwaysAllow: false
  - booking_cancel:
      description: "Cancel a booking"
      alwaysAllow: false
  # Invoicing
  - invoice_list:
      description: "List invoices"
      alwaysAllow: true
  - invoice_create:
      description: "Create an invoice"
      alwaysAllow: false
  - invoice_send:
      description: "Send invoice by email"
      alwaysAllow: false
  - invoice_get_pdf:
      description: "Get invoice PDF"
      alwaysAllow: true
  # SARA AI
  - sara_chat:
      description: "Chat with SARA AI assistant"
      alwaysAllow: false
  - sara_conversations:
      description: "List SARA conversations"
      alwaysAllow: true
  - sara_insights:
      description: "Get AI business insights"
      alwaysAllow: true
  - sara_alerts:
      description: "Get business alerts"
      alwaysAllow: true
  - sara_proactive:
      description: "Get proactive AI suggestions"
      alwaysAllow: true
  # Finance
  - finance_summary:
      description: "Financial overview"
      alwaysAllow: true
  - finance_health_score:
      description: "Business health score"
      alwaysAllow: true
  - finance_cash_flow:
      description: "Cash flow analysis"
      alwaysAllow: true
  # Verticals
  - vertical_kpis:
      description: "Get vertical-specific KPIs"
      alwaysAllow: true
  - vertical_list_data:
      description: "List records from any vertical"
      alwaysAllow: true
  - vertical_create_record:
      description: "Create a record in any vertical"
      alwaysAllow: false
  - vertical_access:
      description: "Check active vertical modules"
      alwaysAllow: true
  # Workflows
  - workflow_list:
      description: "List automation workflows"
      alwaysAllow: true
  - workflow_run:
      description: "Execute a workflow"
      alwaysAllow: false
  - workflow_stats:
      description: "Workflow statistics"
      alwaysAllow: true

documentation:
  usage: |
    ## Quick Start

    1. Get a free API key at https://app.get-scala.com
    2. Install: `npx -y scala-mcp-server`
    3. Set SCALA_API_KEY (CRM etc.) and SCORE_API_KEY (company data: free key at https://score.get-scala.com/builders)

    ## What You Can Do

    **Company Intelligence** (identification data for 249M company records; revenue/employees/net income only where the data licence is confirmed: FR, NO, LT, EE, LV, CO; elsewhere `financials_withheld`; keep `data_licences` attribution)
    > "Find the Norwegian company named Equinor"
    > "Look up a French company's filed accounts"

    **CRM & Sales**
    > "Show my sales pipeline"
    > "Create a contact for John Smith at Acme Corp"

    **Bookings**
    > "What slots are available tomorrow?"
    > "Book a haircut for Maria at 3pm"

    **Invoicing**
    > "Show overdue invoices"
    > "Create an invoice for the Johnson project"

    **SARA AI Assistant**
    > "Ask SARA about last month's revenue"
    > "What business insights does SARA have?"

    **Finance**
    > "What's my business health score?"
    > "Show cash flow for the last 6 months"

    **Industry Verticals** (20 modules)
    > "Show restaurant KPIs for today"
    > "List all vehicles in the dealership"

    **Workflows**
    > "Run the weekly report workflow"

compatibility:
  os:
    - windows
    - linux
    - macos
  node: ">=18"
